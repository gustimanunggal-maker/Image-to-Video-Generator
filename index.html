<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image to Video Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>AI Image to Video Generator</h1>
  <p class="sub">20 Detik • MP4 • Full HD • Tanpa Watermark</p>

  <div class="card">

    <label>Upload Gambar</label>
    <input type="file" id="image" accept="image/*">

    <label>Prompt AI</label>
    <textarea id="prompt" rows="5"
      placeholder="Contoh: Cinematic camera movement, realistic lighting, smooth motion..."></textarea>

    <div class="row">

      <div>
        <label>Rasio</label>
        <select id="ratio">
          <option value="16:9">16 : 9</option>
          <option value="9:16">9 : 16</option>
        </select>
      </div>

      <div>
        <label>Kualitas</label>
        <select id="quality">
          <option value="1080p">Full HD</option>
          <option value="720p">HD</option>
        </select>
      </div>

    </div>

    <button id="generate">Generate Video</button>

    <div class="progress">
      <div id="fill"></div>
    </div>

    <p id="status">Siap digunakan</p>

  </div>

  <div class="preview">
    <img id="previewImg">
  </div>

  <video id="video" controls></video>

  <a id="download">⬇ Download MP4</a>

</div>

<script src="script.js"></script>

</body>
</html>
